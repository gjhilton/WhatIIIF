# whatiiif: template only. Copies call publish.yml and offer-update.yml at the tag of their major version (v1 for
# 1.x); publishing a release by hand moves that tag to it, so every copy runs the released steps from then on. A
# release made on merging, by Live's release job (.github/release.sh), moves the tag itself.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-tag:
    # A pre-release is for trying out: copies keep running the last full release.
    if: github.event.repository.is_template && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Point the tag of its major version (v1 for 1.x) at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major=${TAG%%.*}
          git tag -f "$major" "$TAG"
          if ! git push -f origin "refs/tags/$major"; then
            echo "::error title=$major still points at the previous release::Copies run the steps at $major, so move it by hand: git fetch --tags && git tag -f $major $TAG && git push -f origin refs/tags/$major"
            exit 1
          fi
